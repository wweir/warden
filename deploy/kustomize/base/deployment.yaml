apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden
  namespace: warden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warden
  template:
    metadata:
      labels:
        app: warden
    spec:
      containers:
        - name: warden
          image: ghcr.io/wweir/warden:latest
          ports:
            - containerPort: 9832
          args:
            - "-c"
            - "/etc/warden/warden.yaml"
          volumeMounts:
            - name: config
              mountPath: /etc/warden
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
            requests:
              memory: 128Mi
              cpu: 100m
      volumes:
        - name: config
          configMap:
            name: warden-config
